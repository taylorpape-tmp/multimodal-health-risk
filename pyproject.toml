[project]
name = "hurdle"
version = "0.1.0"
description = "Multimodal diabetes-risk predictor: omics, wearable, CGM, and retinal imaging"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "xgboost",
    "lightgbm",
    "pyarrow",
    "openpyxl",
    "sqlalchemy>=2.0",
    "torch",
    "torchvision",
    "transformers",
]

# reviewers run:  pip install -e ".[dev]"   then  pytest
[project.optional-dependencies]
dev = ["pytest", "ruff"]
serving = ["fastapi", "uvicorn"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]   #line-length handled by formatter; don't fail CI on long lines
